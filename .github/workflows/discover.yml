name: Discover events

# Best effort: GitHub cron can start late or skip runs under load. Never rely on exact timing.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # 4x a day (UTC), off the hour to avoid the busiest minute
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m worker.main discover
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
