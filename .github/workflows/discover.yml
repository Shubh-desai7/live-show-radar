name: Discover events

# Best effort: GitHub cron can start late or skip runs under load. Never rely on exact timing.
# Every 30 minutes: followed artists' and promoters' pages are re-checked each run; other catalog artists' pages
# at most once a day; up to 18 artists per run get their official site discovered (MusicBrainz) and verified.
on:
  schedule:
    - cron: "7,37 * * * *"         # twice an hour, off the busiest minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m worker.main discover
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
